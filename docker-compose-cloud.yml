services:
  catalogue:
    image: shopflowacr.azurecr.io/catalogue:v1
    container_name: catalogue
    environment:
      - AZURE_MONITOR_CONNECTION_STRING=${AZURE_MONITOR_CONNECTION_STRING}
      - JAEGER_ENDPOINT=http://jaeger:4317
    networks:
      - shopflow-net

  checkout:
    image: shopflowacr.azurecr.io/checkout:v1
    container_name: checkout
    ports:
      - "6002:5002"
    environment:
      - AZURE_MONITOR_CONNECTION_STRING=${AZURE_MONITOR_CONNECTION_STRING}
      - JAEGER_ENDPOINT=http://jaeger:4317
      - CATALOGUE_URL=http://catalogue:5001
      - NOTIFICATIONS_URL=http://notifications:5003
    depends_on:
      - catalogue
      - notifications
    networks:
      - shopflow-net

  notifications:
    image: shopflowacr.azurecr.io/notifications:v1
    container_name: notifications
    environment:
      - AZURE_MONITOR_CONNECTION_STRING=${AZURE_MONITOR_CONNECTION_STRING}
      - JAEGER_ENDPOINT=http://jaeger:4317
    networks:
      - shopflow-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    networks:
      - shopflow-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    depends_on:
      - prometheus
      - loki
    networks:
      - shopflow-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - shopflow-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - shopflow-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - shopflow-net

networks:
  shopflow-net:
    driver: bridge