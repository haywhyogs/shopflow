#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - curl
  - git

runcmd:
  # Install Azure CLI properly
  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
  # Start Docker
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker azureuser

  # Login to ACR via Managed Identity
  - az login --identity --client-id ${identity_client_id}
  - az acr login --name ${acr_name}

  # Clone repo
  - git clone ${github_repo} /home/azureuser/shopflow
  - chown -R azureuser:azureuser /home/azureuser/shopflow
