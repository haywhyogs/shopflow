name: Build and Deploy ShopFlow

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and push catalogue
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/catalogue:${{ env.IMAGE_TAG }} ./catalogue
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/catalogue:${{ env.IMAGE_TAG }}

      - name: Build and push checkout
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/checkout:${{ env.IMAGE_TAG }} ./checkout
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/checkout:${{ env.IMAGE_TAG }}

      - name: Build and push notifications
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/notifications:${{ env.IMAGE_TAG }} ./notifications
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/notifications:${{ env.IMAGE_TAG }}

      - name: Deploy to VM
        run: |
          az vm run-command invoke \
            --resource-group shopflow-rg \
            --name shopflow-vm \
            --command-id RunShellScript \
            --scripts "
              cd /home/azureuser/shopflow
              git config --global --add safe.directory /home/azureuser/shopflow
              git fetch --all
              git reset --hard origin/main
              echo 'Current commit:'
              git log --oneline -1

              echo 'Repository status:'
              git status
              export IMAGE_TAG=${{ env.IMAGE_TAG }}
              export ACR=${{ secrets.ACR_LOGIN_SERVER }}
              az login --identity --client-id ${{ secrets.IDENTITY_CLIENT_ID }}
              az acr login --name ${{ secrets.ACR_NAME }}

              # Fetch secrets from Key Vault
              GRAFANA_PASSWORD=\$(az keyvault secret show \
                --vault-name shopflow-kv \
                --name grafana-admin-password \
                --query value -o tsv)

              # Write .env
              echo \"GRAFANA_PASSWORD=\${GRAFANA_PASSWORD}\" > /home/azureuser/shopflow/.env
              echo \"ACR=${{ secrets.ACR_LOGIN_SERVER }}\" >> /home/azureuser/shopflow/.env
              echo \"IMAGE_TAG=${{ env.IMAGE_TAG }}\" >> /home/azureuser/shopflow/.env

              # Start stack
              docker compose -f docker-compose-cloud.yml pull
              docker compose -f docker-compose-cloud.yml up -d --force-recreate

              # Wait for Grafana and import dashboard
              for i in \$(seq 1 20); do
                STATUS=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health)
                if [ \"\$STATUS\" = \"200\" ]; then
                  echo 'Grafana ready'
                  break
                fi
                sleep 15
              done

              curl -s -X POST \
                http://admin:\${GRAFANA_PASSWORD}@localhost:3000/api/dashboards/import \
                -H 'Content-Type: application/json' \
                -d \"{\\\"dashboard\\\": \$(cat /home/azureuser/shopflow/grafana/dashboards/shopflow-metrics.json), \\\"overwrite\\\": true, \\\"folderId\\\": 0}\"
            "