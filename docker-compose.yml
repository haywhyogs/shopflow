version: "3.9"

services:

  catalogue:
    build: ./catalogue
    container_name: catalogue
    ports:
      - "6001:5001"

  checkout:
    build: ./checkout
    container_name: checkout
    ports:
      - "6002:5002"
    depends_on:
      - catalogue

  notifications:
    build: ./notifications
    container_name: notifications
    ports:
      - "6003:5003"
  
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
    - grafana-data:/var/lib/grafana
volumes:
  grafana-data: