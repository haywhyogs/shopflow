<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Service Unavailable | ShopFlow Electronics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="{{ url_for('index') }}">
                <i class="bi bi-lightning-charge-fill me-2"></i>ShopFlow
            </a>
        </div>
    </nav>

    <!-- Error Page -->
    <main class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
        <div class="container text-center">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="error-illustration mb-5">
                        <i class="bi bi-wifi-off text-warning display-1 opacity-25"></i>
                    </div>
                    <h1 class="display-4 fw-bold text-dark mb-3">Service Temporarily Unavailable</h1>
                    <p class="lead text-muted mb-4">{{ message }}</p>
                    <p class="text-muted mb-5">Our team has been notified. Please try again in a few moments.</p>
                    <div class="d-flex flex-wrap justify-content-center gap-3">
                        <button class="btn btn-primary btn-lg px-5" onclick="window.location.reload()">
                            <i class="bi bi-arrow-clockwise me-2"></i>Retry Now
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-primary btn-lg px-5">
                            <i class="bi bi-house-door-fill me-2"></i>Return Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer bg-dark text-white py-5 mt-auto">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <p class="text-white-50 small mb-0">&copy; 2024 ShopFlow Electronics. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="#" class="text-white-50 text-decoration-none small me-3">Privacy Policy</a>
                    <a href="#" class="text-white-50 text-decoration-none small me-3">Terms of Service</a>
                    <a href="#" class="text-white-50 text-decoration-none small">Contact</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
